name: TPCore
version: '${version}'
main: com.lunatech.tpcore.TPCore
api-version: '1.20'
author: lunarenzo
description: High-performance, modular teleportation plugin for PaperMC and Folia.
folia-supported: true

dependencies:
  server:
    floodgate:
      load: BEFORE
      required: false
      join-classpath: true
    WorldGuard:
      load: BEFORE
      required: false
      join-classpath: true
    GriefPrevention:
      load: BEFORE
      required: false
      join-classpath: true
    Vault:
      load: BEFORE
      required: false
      join-classpath: true
    VaultUnlocked:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  tpcore.home.use:
    default: true
  tpcore.home.set:
    default: true
  tpcore.home.list:
    default: true
  tpcore.home.del:
    default: true
  tpcore.home.other:
    default: op
  tpcore.home.admin.payments:
    default: op
  tpcore.home.bypass.cost:
    default: false
  tpcore.home.bypass.cost.teleport:
    default: false
  tpcore.home.bypass.cost.create:
    default: false
  tpcore.warp.payments.acknowledge:
    description: Acknowledge independently reconciled warp payments and reset an idle payment circuit. Never transfers money.
    default: op
  tpcore.warp.sign.use:
    description: Use a warp sign, subject to normal warp permissions and policies.
    default: true
  tpcore.warp.sign.create:
    description: Bind a sign face to an existing server warp.
    default: op
  tpcore.warp.sign.remove:
    description: Remove a warp sign binding and clear that face.
    default: op
  tpcore.warp.sign.info:
    description: Inspect a warp sign binding.
    default: op
  tpcore.warp.sign.break:
    description: Break a block with a warp sign binding.
    default: op
  tpcore.warp.status:
    description: View warp storage, capacity and payment health summaries.
    default: op
  tpcore.warp.payments:
    description: Inspect retained warp payment evidence without retrying transfers.
    default: op
  tpcore.warp.import:
    description: Preview and confirm EssentialsX server warp imports.
    default: op
  tpcore.warp.del:
    description: Confirm and archive server warp deletions.
    default: op
  tpcore.warp.recover:
    description: List and restore bounded server warp deletion history.
    default: op
  tpcore.warp.edit.availability:
    description: Close or reopen server warps.
    default: op
  tpcore.warp.edit.visibility:
    description: Hide or list server warps in public discovery.
    default: op
  tpcore.warp.info:
    description: Inspect server warp metadata without revealing password hashes.
    default: op
  tpcore.warp.edit:
    description: Grant all server warp editing permissions.
    default: op
    children:
      tpcore.warp.info: true
      tpcore.warp.edit.rename: true
      tpcore.warp.edit.relocate: true
      tpcore.warp.edit.category: true
      tpcore.warp.edit.password: true
      tpcore.warp.edit.permission: true
      tpcore.warp.edit.availability: true
      tpcore.warp.edit.visibility: true
  tpcore.warp.edit.rename:
    description: Rename server warps; external per-warp grants must be updated manually.
    default: op
  tpcore.warp.edit.relocate:
    description: Relocate server warps to the executing player's position.
    default: op
  tpcore.warp.edit.category:
    description: Change server warp categories.
    default: op
  tpcore.warp.edit.password:
    description: Set or clear server warp passwords.
    default: op
  tpcore.warp.edit.permission:
    description: Toggle per-warp permission requirements.
    default: op
  tpcore.tpa.player:
    description: Grants default TPA permissions for non-op players (use, here, accept, deny, cancel, toggle, block, unblock, blocklist, autoaccept)
    default: true
    children:
      tpcore.tpa.use: true
      tpcore.tpa.here: true
      tpcore.tpa.accept: true
      tpcore.tpa.deny: true
      tpcore.tpa.cancel: true
      tpcore.tpa.toggle: true
      tpcore.tpa.block: true
      tpcore.tpa.unblock: true
      tpcore.tpa.blocklist: true
      tpcore.tpa.autoaccept: true

  tpcore.tpa.admin:
    description: Grants administrative TPA permissions (bulk selectors, warmup bypass, admin commands)
    default: op
    children:
      tpcore.tpa.player: true
      tpcore.tpa.all: true
      tpcore.tpa.bypass.warmup: true
