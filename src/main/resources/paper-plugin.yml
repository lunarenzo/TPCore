name: TPCore
version: '${version}'
main: com.lunatech.tpcore.TPCore
api-version: '1.20'
author: lunarenzo
description: High-performance, modular teleportation plugin for PaperMC and Folia.
folia-supported: true

dependencies:
  server:
    Vault:
      load: BEFORE
      required: false
      join-classpath: true
    VaultUnlocked:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  tpcore.warp.info:
    description: Inspect server warp metadata without revealing password hashes.
    default: op
  tpcore.warp.edit:
    description: Grant all server warp editing permissions.
    default: op
    children:
      tpcore.warp.info: true
      tpcore.warp.edit.rename: true
      tpcore.warp.edit.relocate: true
      tpcore.warp.edit.category: true
      tpcore.warp.edit.password: true
      tpcore.warp.edit.permission: true
  tpcore.warp.edit.rename:
    description: Rename server warps; external per-warp grants must be updated manually.
    default: op
  tpcore.warp.edit.relocate:
    description: Relocate server warps to the executing player's position.
    default: op
  tpcore.warp.edit.category:
    description: Change server warp categories.
    default: op
  tpcore.warp.edit.password:
    description: Set or clear server warp passwords.
    default: op
  tpcore.warp.edit.permission:
    description: Toggle per-warp permission requirements.
    default: op
  tpcore.tpa.player:
    description: Grants default TPA permissions for non-op players (use, here, accept, deny, cancel, toggle, block, unblock, blocklist, autoaccept)
    default: true
    children:
      tpcore.tpa.use: true
      tpcore.tpa.here: true
      tpcore.tpa.accept: true
      tpcore.tpa.deny: true
      tpcore.tpa.cancel: true
      tpcore.tpa.toggle: true
      tpcore.tpa.block: true
      tpcore.tpa.unblock: true
      tpcore.tpa.blocklist: true
      tpcore.tpa.autoaccept: true

  tpcore.tpa.admin:
    description: Grants administrative TPA permissions (bulk selectors, warmup bypass, admin commands)
    default: op
    children:
      tpcore.tpa.player: true
      tpcore.tpa.all: true
      tpcore.tpa.bypass.warmup: true
