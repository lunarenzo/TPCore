# Home uses SQLite. Commands remain registered while storage starts.
enabled: true
default-home-name: home
warmup-seconds: 3
cooldown-seconds: 10
cancel-on-move: true
cancel-on-damage: true
require-overwrite-confirmation: true
# Kept for older configurations; sharing commands are not exposed.
enable-home-sharing: true
# After normal respawn, attempt a safe home teleport if there is no bed/anchor.
respawn-at-primary-home: false
benchmark:
  # /homebenchmark [count] times one read of your own saved homes; it never writes.
  enabled: false
safety-checks:
  prevent-unsafe-teleport: true
  prevent-nether-roof: true
  max-nether-height: 128
  max-concurrent-chunk-loads: 8
world-restrictions:
  mode: BLACKLIST
  worlds: [world_nether_resource, minigames]
# Grant tpcore.homes.limit.<tier> or a numeric tpcore.homes.limit.<number>.
home-limits:
  default: 3
  vip: 5
  mvp: 10
  staff: 50
runtime:
  storage-queue-capacity: 64
  # Also caps unresolved native teleports, with that cap set at server startup.
  max-requests: 32
  max-cooldowns: 2048
  # Applies in addition to the configured warmup.
  timeout-seconds: 15
  safety-freshness-millis: 500
  list-page-size: 10
  # Applies ONLY to homes saved before world UUIDs were stored.
  # Use /sethome <name> -f in the intended world to bind a legacy home.
  allow-legacy-world-names: true
  # Leave false to avoid generating terrain while checking homes.
  generate-chunks: false
  # Latest deletion per owner/name; old entries expire and capacity is server-wide.
  recovery-capacity: 2048
  recovery-days: 7
  hazards: [MAGMA_BLOCK, LAVA, FIRE, SOUL_FIRE, CACTUS, SWEET_BERRY_BUSH, POWDER_SNOW, WITHER_ROSE, CAMPFIRE, SOUL_CAMPFIRE, POINTED_DRIPSTONE]
  messages:
    not-ready: "<prefix><yellow>Home storage is starting. Try again shortly.</yellow>"
    storage-error: "<prefix><red>Home storage is unavailable. Contact an administrator.</red>"
    busy: "<prefix><yellow>Home is busy or you already have a request. Try again shortly.</yellow>"
    invalid-name: "<prefix><red>Use 1–32 letters, numbers, dots, underscores, plus signs or hyphens for a home name.</red>"
    cancelled: "<prefix><yellow>Your home teleport was cancelled.</yellow>"
    timed-out: "<prefix><yellow>Your home request timed out before teleporting. Try again shortly.</yellow>"
    outcome-unknown: "<prefix><yellow>The server has not confirmed your teleport. Wait before trying again.</yellow>"
    teleport-failed: "<prefix><red>The server did not complete your home teleport.</red>"
    world-unavailable: "<prefix><red>The saved world is unavailable. Check with staff or reset this home in the intended world.</red>"
    travel-world-restricted: "<prefix><red>This home's destination world is restricted.</red>"
    no-permission: "<prefix><red>You no longer have permission to use this home command.</red>"
    unknown-owner: "<prefix><red>Player <target> is not online or known by the server.</red>"
    archived: "<prefix><green>Home <home> deleted. Use /homerestore <home> while its archive is available.</green>"
    restored: "<prefix><green>Home <home> restored.</green>"
    restore-conflict: "<prefix><red>You already have a home called <home>. The archive was kept.</red>"
    recovery-not-found: "<prefix><red>No recoverable archive for <home> was found.</red>"
    list-page: "<prefix><gold>Your homes — page <page></gold>"
    empty-page: "<prefix><yellow>There are no homes on this page.</yellow>"
    list-next: "<prefix><gray>Next page: <click:run_command:'/homes <page>'><gold>[Next]</gold></click></gray>"
    benchmark-read: "<prefix><gray>Home storage read: <count> rows in <millis> ms (including queue time).</gray>"
