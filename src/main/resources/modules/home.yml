# Home uses SQLite. Commands remain registered while storage starts.
enabled: true
default-home-name: home
warmup-seconds: 3
cooldown-seconds: 10
cancel-on-move: true
cancel-on-damage: true
require-overwrite-confirmation: true
# Kept for older configurations; sharing commands are not exposed.
enable-home-sharing: true
# After normal respawn, attempt a safe home teleport if there is no bed/anchor.
respawn-at-primary-home: false
benchmark:
  # /homebenchmark [count] times one read of your own saved homes; it never writes.
  enabled: false
safety-checks:
  prevent-unsafe-teleport: true
  prevent-nether-roof: true
  max-nether-height: 128
  max-concurrent-chunk-loads: 8
world-restrictions:
  # BLACKLIST blocks the listed worlds. WHITELIST allows only the listed worlds.
  # Invalid modes are rejected. An empty WHITELIST world list allows no worlds.
  mode: BLACKLIST
  worlds: [world_nether_resource, minigames]
# Grant tpcore.homes.limit.<tier> or a numeric tpcore.homes.limit.<number>.
home-limits:
  default: 3
  vip: 5
  mvp: 10
  staff: 50
# Inventory menus. When disabled, /home and /homes use their original chat behavior.
gui:
  enabled: true
  prompt-timeout-seconds: 60
  bedrock:
    # Use native menus and naming forms for players recognized by Floodgate.
    enabled: true
    messages:
      title: "Create Home"
      description: "Your home will be saved at your location when you submit."
      name-label: "Home name"
      placeholder: "Enter a home name"
      blank: "Enter a name for your home."
      invalid: "Use 1–32 letters, numbers, dots, underscores, plus signs, or hyphens."
      duplicate: "You already have a home with that name. Choose a different name."
      unavailable: "<yellow>The Bedrock form is unavailable."
      menu-title: "Home"
      menu-description: "Homes saved: {count}/{limit}"
      set-home: "Set Home"
      my-homes: "My Homes"
      list-title: "My Homes ({page}/{pages})"
      list-description: "Select a home to view its destination and actions."
      empty-list: "You have no saved homes yet."
      home-title: "{name}"
      home-destination: "World: {world}\nX: {x}  Y: {y}  Z: {z}"
      teleport: "Teleport"
      delete: "Delete"
      delete-title: "Delete {name}?"
      delete-description: "This archives the home. You can recover it with /homerestore."
      confirm-delete: "Confirm deletion"
      cancel: "Cancel"
      previous: "Previous Page"
      next: "Next Page"
      back: "Back"
  titles:
    menu: "SetHome GUI – Menu"
    homes: "My Homes (<page>/<pages>)"
    confirm: "Delete home?"
  icons:
    frame:
      material: GRAY_STAINED_GLASS_PANE
      name: " "
      lore: []
    set:
      material: RED_BED
      name: "<gold>Set Home"
      lore: ["<gray>Create a new home here.", "", "<gold>• Current homes: <white><count>/<limit>", "", "<yellow>▶ Click to enter a name."]
    homes:
      material: BOOK
      name: "<gold>My Homes"
      lore: ["<gray>View and teleport to your homes.", "", "<yellow>▶ Click to open the list."]
    home:
      material: CYAN_BED
      name: "<gold>Home: <name>"
      lore: ["<gray>Destination information:", "<gray>• World: <white><world>", "<gray>• X: <white><x> <gray>Y: <white><y> <gray>Z: <white><z>", ""]
    previous:
      material: PLAYER_HEAD
      name: "<gold>◀ Previous Page"
      lore: []
    next:
      material: PLAYER_HEAD
      name: "<gold>Next Page ▶"
      lore: []
    back:
      material: BARRIER
      name: "<red>✖ Go Back"
      lore: []
    confirm:
      material: LIME_DYE
      name: "<green>Confirm deletion"
      lore: ["<gray>Archive <yellow><name><gray>. You can recover it with /homerestore."]
    cancel:
      material: RED_DYE
      name: "<red>Cancel"
      lore: []
    empty:
      material: PAPER
      name: "<yellow>No homes yet"
      lore: ["<gray>Go back to create a home."]
  messages:
    unlimited: "Unlimited"
    left-click: "<gold>▶ Left-click to teleport."
    right-click: "<red>◀ Right-click to delete."
    prompt: "<yellow>Choose a name for your new home."
    manual-name: "<gray>You can also type <yellow>/sethome <unused-name></yellow> using a name you haven't saved."
    enter-name: "<green>[Enter a name]"
    use-default: "<gold>[Use default: <name>]"
    cancel-prompt: "<red>[Cancel]"
    prompt-cancelled: "<gray>Home naming cancelled."
    prompt-expired: "<yellow>This naming prompt expired. Open Set Home again."
    form-expired: "<yellow>This Home form expired. Use /home gui or /homes to open it again."
    disabled: "<yellow>The Home GUI is disabled."
    home-changed: "<yellow>That home was changed or removed. Open the list again to see the latest destination."
economy:
  enabled: false
  teleport-cost: "0.00"
  create-cost: "0.00"
  max-unresolved-payments: 256
  payment-history-limit: 512
  # Home prefers native async VaultUnlocked. For classic Vault, add the exact
  # PluginName/provider.class.Name reported by Home in the server log.
  # Only list providers whose balance, debit and refund calls support worker-thread use.
  legacy-async-providers: []
  messages:
    fee: "<gray>Home fee: <gold><amount></gold>.</gray>"
    menu-fee: "Fee: <amount>"
    economy-unavailable: "<red>Home payments are unavailable.</red>"
    insufficient-funds: "<red>You do not have enough funds for this home action.</red>"
    payment-rejected: "<red>The economy provider rejected your home payment.</red>"
    payment-pending: "<yellow>The payment outcome is pending. Contact staff if it does not resolve.</yellow>"
    payment-refunded: "<yellow>Your home fee of <gold><amount></gold> was refunded.</yellow>"
    payment-not-found: "<yellow>No matching home payment was found.</yellow>"
    payment-acknowledged: "<green>Payment <id> marked as reconciled.</green>"
    payment-ack-denied: "<yellow>Only an unresolved payment without active work can be acknowledged.</yellow>"
    payment-circuit: "<gray>Home payment circuit: <status></gray>"
    payment-circuit-changed: "<yellow>Home payment circuit action accepted: <accepted>. Inspect /homepayments circuit.</yellow>"
    payment-evidence: "<gray>Evidence: <evidence></gray>"
    evidence-debit-pending: "Withdrawal intent persisted. A withdrawal may have started. No final debit receipt is recorded."
    evidence-debit-unknown: "Withdrawal failed or its outcome could not be established. Check provider debit history."
    evidence-debited: "Debit recorded. Creation has not yet been confirmed."
    evidence-teleport-pending: "Debit recorded. Home travel was prepared or dispatched. Await the arrival result."
    evidence-teleport-unknown: "Debit recorded, but arrival outcome is unknown. Check the player's travel before refunding."
    evidence-refund-pending: "Refund intent recorded. A refund may have started. Check provider credit history."
    evidence-refund-unknown: "Refund outcome is unknown or incomplete. The recorded refund is the observed credit, if available."
    evidence-creation-unknown: "Debit recorded, but creation outcome is uncertain. Check the saved home and provider history."
    evidence-review: "Legacy REVIEW entry. Its interrupted operation is not recorded. Check debit, credit and home history."
    evidence-rejected: "Payment was rejected before a confirmed debit."
    evidence-kept: "Home action completed and the recorded debit was kept."
    evidence-refunded: "The provider confirmed the exact refund."
    evidence-acknowledged: "Staff independently reconciled and acknowledged this entry."
    payment-row: "<gray><id> | <player> | <action> <home> | <state> | <amount></gray>"
    payment-detail: "<gray>Provider: <provider> | Debit: <debit> | Refund: <refund> | Updated: <updated> | Reconciled by: <operator></gray>"
runtime:
  storage-queue-capacity: 64
  # Time allowed to drain accepted operations on shutdown. Queued writes that miss the deadline are discarded and logged.
  storage-drain-seconds: 10
  # Also sets the normal native teleport limit at server startup.
  max-requests: 32
  # Extra slots per phase (chunk inspections and native teleports) when timed-out server work is still unresolved.
  # A player with an unresolved dispatched teleport still cannot start a second one.
  stalled-work-reserve: 2
  max-cooldowns: 2048
  # Bounds lookup and post-warmup work separately.
  timeout-seconds: 15
  # Wall-clock backstop for tick-based warmup, allowing the countdown to survive low TPS.
  warmup-timeout-seconds: 900
  safety-freshness-millis: 500
  list-page-size: 10
  # Applies ONLY to homes saved before world UUIDs were stored.
  # Use /sethome <name> -f in the intended world to bind a legacy home.
  allow-legacy-world-names: true
  # Leave false to avoid generating terrain while checking homes.
  generate-chunks: false
  # Latest deletion per owner/name; old entries expire and capacity is server-wide.
  recovery-capacity: 2048
  recovery-days: 7
  hazards: [MAGMA_BLOCK, LAVA, FIRE, SOUL_FIRE, CACTUS, SWEET_BERRY_BUSH, POWDER_SNOW, WITHER_ROSE, CAMPFIRE, SOUL_CAMPFIRE, POINTED_DRIPSTONE]
