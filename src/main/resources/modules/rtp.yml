# TPCore - Quantum-RTP Module Configuration
enabled: true
buffer-capacity: 20
max-mspt-threshold: 45.0
demand-window-minutes: 15

world-configs:
  world:
    world-name: "world"
    enabled: true
    min-radius: 100
    max-radius: 5000
    center-x: 0
    center-z: 0
    shape: "CIRCLE"
    biome-blacklist:
      - "OCEAN"
      - "DEEP_OCEAN"
      - "WARM_OCEAN"
      - "LUKEWARM_OCEAN"
      - "COLD_OCEAN"
      - "DEEP_COLD_OCEAN"
      - "FROZEN_OCEAN"
      - "DEEP_FROZEN_OCEAN"
    # Exact vanilla biome names (PLAINS or minecraft:plains). Empty allows any biome not blacklisted.
    # The blacklist wins when a biome appears in both lists.
    biome-whitelist: []
    cooldown-seconds: 60
    warmup-seconds: 0
    max-attempts: 30
    allow-mounted: false
    # Charged in the provider default currency only when economy.enabled is true.
    # Quoted decimals preserve precision. The exact debit is refunded on confirmed failure.
    cost: "0.00"
    # Retain already-loaded chunks in the destination's 3x3 area for 100 ticks.
    # Tickets are bounded, shared by overlapping trips, and changed on each chunk's owner.
    # This does not synchronously load missing neighboring chunks; teleportAsync loads the destination.
    use-chunk-tickets: false

messages:
  prefix: "<gradient:#00FFAA:#00AAFF>[RTP]</gradient> "
  disabled: "<red>Random teleportation is currently disabled.</red>"
  no-permission: "<red>You do not have permission to use random teleportation.</red>"
  world-disabled: "<red>Random teleportation is disabled in world '<world>'.</red>"
  cooldown-active: "<red>Please wait <seconds> seconds before using RTP again.</red>"
  warmup-started: "<green>Teleporting in <seconds> seconds. Do not move or take damage!</green>"
  warmup-already-active: "<red>You are already warming up for a teleport!</red>"
  warmup-cancelled: "<red>Teleport cancelled due to movement or damage.</red>"
  queue-warming-up: "<yellow>RTP queue is warming up candidates, please try again in a few seconds.</yellow>"
  search-failed: "<red>Failed to find a safe location after multiple retries. Try again later.</red>"
  teleport-success: "<green>Teleported to <x>, <y>, <z> in <world>!</green>"
  teleport-failed: "<red>Teleport failed due to unsafe terrain target.</red>"
  only-players: "<red>Only players can execute random teleportation.</red>"
  world-not-found: "<red>World '<world>' does not exist or is not loaded.</red>"
  busy: "<yellow>RTP is busy or you already have a pending request. Try again shortly.</yellow>"
  timed-out: "<yellow>Your RTP search timed out before departure.</yellow>"
  outcome-unknown: "<yellow>Your teleport was dispatched but its arrival is unconfirmed. Wait before trying again.</yellow>"
  reload-failed: "<red>RTP reload failed. The last valid configuration was retained.</red>"
  reload-success: "<green>RTP module configuration reloaded successfully.</green>"

# Bounds requests independently from cached destinations. Generation preserves previous behavior;
# turn it off on pre-generated worlds to prevent RTP from generating new terrain.
runtime:
  max-requests: 16
  timeout-seconds: 20
  max-cooldowns: 2048
  generate-chunks: true
  storage-queue-capacity: 64
  cache-retention-per-world: 64
  cache-max-age-minutes: 60

# Positive world costs require an available provider. Free/bypassed travel never queries it.
# Native VaultUnlocked AsyncEconomy is preferred. Classic Vault providers must be explicitly
# listed below only after verifying that their calls support worker-thread execution.
economy:
  enabled: false
  max-unresolved-payments: 256
  payment-history-limit: 512
  settlement-drain-seconds: 10
  legacy-async-providers: []
  messages:
    fee: "<gray>RTP fee: <gold><amount></gold>.</gray>"
    economy-unavailable: "<red>RTP payments are unavailable.</red>"
    insufficient-funds: "<red>You do not have enough funds for this RTP action.</red>"
    payment-rejected: "<red>The economy provider rejected your RTP payment.</red>"
    payment-pending: "<yellow>The payment outcome is pending. Contact staff if it does not resolve.</yellow>"
    payment-refunded: "<yellow>Your RTP fee of <gold><amount></gold> was refunded.</yellow>"
    payment-not-found: "<yellow>No matching RTP payment was found.</yellow>"
    payment-acknowledged: "<green>Payment <id> marked as reconciled.</green>"
    payment-ack-denied: "<yellow>Only an unresolved payment without active work can be acknowledged.</yellow>"
    payment-circuit: "<gray>RTP payment circuit: <status></gray>"
    payment-circuit-changed: "<yellow>RTP payment circuit action accepted: <accepted>. Inspect /rtppayments circuit.</yellow>"
    payment-evidence: "<gray>Evidence: <evidence></gray>"
    evidence-debit-pending: "Withdrawal intent persisted. A withdrawal may have started. No final debit receipt is recorded."
    evidence-debit-unknown: "Withdrawal failed or its outcome could not be established. Check provider debit history."
    evidence-teleport-pending: "Debit recorded. RTP travel was prepared or dispatched. Await the arrival result."
    evidence-teleport-unknown: "Debit recorded, but arrival outcome is unknown. Check the player's travel before refunding."
    evidence-refund-pending: "Refund intent recorded. A refund may have started. Check provider credit history."
    evidence-refund-unknown: "Refund outcome is unknown or incomplete. The recorded refund is the observed credit, if available."
    evidence-rejected: "Payment was rejected before a confirmed debit."
    evidence-kept: "RTP action completed and the recorded debit was kept."
    evidence-refunded: "The provider confirmed the exact refund."
    evidence-acknowledged: "Staff independently reconciled and acknowledged this entry."
    payment-row: "<gray><id> | <player> | <action> <world> | <state> | <amount></gray>"
    payment-detail: "<gray>Provider: <provider> | Debit: <debit> | Refund: <refund> | Updated: <updated> | Reconciled by: <operator></gray>"
