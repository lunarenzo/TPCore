# TPCore - Quantum-RTP Module Configuration
enabled: true
buffer-capacity: 20
max-mspt-threshold: 45.0
demand-window-minutes: 15

world-configs:
  world:
    world-name: "world"
    enabled: true
    min-radius: 100
    max-radius: 5000
    center-x: 0
    center-z: 0
    shape: "CIRCLE"
    biome-blacklist:
      - "OCEAN"
      - "DEEP_OCEAN"
      - "WARM_OCEAN"
      - "LUKEWARM_OCEAN"
      - "COLD_OCEAN"
      - "DEEP_COLD_OCEAN"
      - "FROZEN_OCEAN"
      - "DEEP_FROZEN_OCEAN"
    biome-whitelist: []
    cooldown-seconds: 60
    warmup-seconds: 0
    cost: 0.0
    # Controls whether TPCore explicitly registers a 100-tick (5-second) plugin chunk ticket upon teleportation.
    #
    # false (Recommended Default):
    #   - Uses Paper's native player.teleportAsync() pipeline.
    #   - Minimal main-thread processing overhead.
    #   - Delegates chunk loading and lifecycle management directly to Paper's engine without registering
    #     explicit plugin tickets in ChunkHolderManager.
    #
    # true:
    #   - Explicitly forces Paper to hold a 100-tick plugin chunk ticket post-teleport.
    #   - Prevents immediate chunk unloading if players have slow client rendering or network connections,
    #     ensuring target blocks remain loaded in server memory for 5 seconds post-teleport.
    #   - Incurs additional ticket registration processing overhead in Paper's ChunkHolderManager.
    use-chunk-tickets: false

messages:
  prefix: "<gradient:#00FFAA:#00AAFF>[RTP]</gradient> "
  disabled: "<red>Random teleportation is currently disabled.</red>"
  no-permission: "<red>You do not have permission to use random teleportation.</red>"
  world-disabled: "<red>Random teleportation is disabled in world '<world>'.</red>"
  cooldown-active: "<red>Please wait <seconds> seconds before using RTP again.</red>"
  warmup-started: "<green>Teleporting in <seconds> seconds. Do not move or take damage!</green>"
  warmup-already-active: "<red>You are already warming up for a teleport!</red>"
  warmup-cancelled: "<red>Teleport cancelled due to movement or damage.</red>"
  queue-warming-up: "<yellow>RTP queue is warming up candidates, please try again in a few seconds.</yellow>"
  search-failed: "<red>Failed to find a safe location after multiple retries. Try again later.</red>"
  teleport-success: "<green>Teleported to <x>, <y>, <z> in <world>!</green>"
  teleport-failed: "<red>Teleport failed due to unsafe terrain target.</red>"
  only-players: "<red>Only players can execute random teleportation.</red>"
  world-not-found: "<red>World '<world>' does not exist or is not loaded.</red>"
  reload-success: "<green>RTP module configuration reloaded successfully.</green>"
