  cost-deducted: "<prefix><gold><cost></gold> <green>has been deducted from your account.</green>"
  cost-refunded: "<prefix><gold><cost></gold> <green>has been refunded to your account.</green>"
  del-warp-success: "<prefix><green>Warp <yellow><warp></yellow> has been deleted.</green>"
  del-warp-usage: "<prefix><red>Usage: <gold>/delwarp <name></gold></red>"
  insufficient-funds: "<prefix><red>You do not have enough money! Required: <gold><cost></gold>, Balance: <gold><balance></gold></red>"
  invalid-password: "<prefix><red>Incorrect password for warp <yellow><warp></yellow>!</red>"
  invalid-warp-name: "<prefix><red>Invalid warp name! Warp names must be 1-32 alphanumeric characters.</red>"
  limit-reached: "<prefix><red>You have reached the maximum warp limit!</red>"
  module-disabled: "<prefix><red>Warp module is currently disabled.</red>"
  no-permission: "<prefix><red>You do not have permission to access warp <yellow><warp></yellow>!</red>"
  only-players: "<prefix><red>Only players can execute this command!</red>"
  password-required: "<prefix><red>Warp <yellow><warp></yellow> is password protected! Usage: <gold>/warp <warp> <password></gold></red>"
  player-not-online: "<prefix><red>Player <yellow><target></yellow> is not currently online!</red>"
