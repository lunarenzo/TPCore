# TPCore - Warp Module Configuration
enabled: true
warmup-seconds: 3
cooldown-seconds: 10
cancel-on-move: true
cancel-on-damage: true
default-permission-gated: false
default-category: "general"
warps-per-page: 8
max-warps: 100
# Resource admission limits (restart module to change storage queue capacity)
max-concurrent-operations: 64
max-cached-warps: 4096
max-player-state-entries: 2048
storage-queue-capacity: 128
operation-timeout-seconds: 30
# Maximum YAML input size; SQLite reads are bounded by max-cached-warps.
max-storage-bytes: 16777216

# Paid operations require VaultUnlocked 2.20+ and a provider exposing native AsyncEconomy.
economy-enabled: false
warp-cost: 0.0
set-warp-cost: 0.0
charge-timing: "CHARGE_ON_WARMUP"
refund-on-cancel: true

safety-checks:
  prevent-unsafe-teleport: true
  prevent-nether-roof: true
  max-nether-height: 128
  # EXACT never adjusts coordinates. NEARBY tries integer offsets, closest first.
  # The Euclidean radius includes vertical movement; no separate deep surface scan.
  destination-policy: "NEARBY"
  max-adjustment-distance: 3
  max-candidates: 256
  # DENY: no water. SURFACE: water below feet only. ALLOW: also permit immersion.
  # Waterlogged solids remain rejected in every mode.
  water-policy: "ALLOW"
  # Uppercase Material name fragments; an empty list disables these hazard exclusions.
  hazard-patterns: [LAVA, FIRE, MAGMA, CACTUS, BERRY_BUSH, WITHER_ROSE, POWDER_SNOW, WEB, BUBBLE, POINTED_DRIPSTONE, RESPAWN_ANCHOR, PORTAL, GATEWAY, VOID, PRESSURE_PLATE, TRIPWIRE, SCULK_SENSOR, SCULK_SHRIEKER]

policies:
  # Missing fields inherit individually: warp -> category -> global.
  # Zero explicitly means free / no warmup / no cooldown. Economy must be enabled.
  # Example: hub: {price: 0.0, warmup-seconds: 0, cooldown-seconds: 0}
  # Keys are case-insensitive names. Rename config keys when renaming warps.
  warps: {}
  categories: {}
  # Empty allowed = all worlds; denied always wins. Exact names, case-insensitive.
  # These rules apply to staff-forced teleports too; there is no implicit admin bypass.
  creation-worlds: {allowed: [], denied: []}
  source-worlds: {allowed: [], denied: []}
  destination-worlds: {allowed: [], denied: []}
  combat-enabled: false
  combat-seconds: 10
  # PvP tags attacker and victim, including player-fired projectiles. False tags all damage.
  combat-pvp-only: true
  # Optional, public-API reflection; no extra dependencies are bundled.
  # Queries supported only on Paper's main thread. Enabled on Folia, missing,
  # disabled or incompatible providers DENY creation and travel. Reload after enabling a provider.
  worldguard-enabled: false
  griefprevention-enabled: false
  messages:
    quote: "<prefix><yellow>Warp <warp>: price <price>; warmup <warmup>s; cooldown <cooldown>s.</yellow>"
    world-restricted: "<prefix><red>Warp creation or travel is not allowed by the world rules.</red>"
    combat-tagged: "<prefix><red>You cannot warp while combat tagged. Wait until combat expires.</red>"
    protection-denied: "<prefix><red>Protection denied this operation, or an enabled protection hook is unavailable or unsupported. Ask an administrator.</red>"

storage:
  type: "SQLITE"

# Imports read EssentialsX files directly; EssentialsX need not be installed.
# Paths are relative to the server plugins directory and must remain inside it.
# Backups are kept in TPCore/warp-import-backups; the limit refuses new imports,
# never automatically deletes a recovery copy. Archive old copies manually.
essentials-import:
  source-folder: "Essentials/warps"
  max-files: 1024
  max-file-bytes: 65536
  max-total-bytes: 4194304
  preview-seconds: 120
  preview-lines: 20
  max-backups: 5
  category: "imported"
  permission-required: true
  messages:
    description: "Preview and import EssentialsX server warps"
    usage: "<prefix><yellow>/warpimport essentials preview [skip|replace|rename]; /warpimport essentials confirm <token></yellow>"
    preview: "<prefix><gold>EssentialsX preview: <files> files; <count> selected; <conflicts> conflicts; <invalid> invalid; policy <policy>.</gold>"
    entry: "<gray><file>: <name> → <target> — <reason></gray>"
    confirmation: "<prefix><yellow>Run /warpimport essentials confirm <token> within <seconds>s. A newer preview replaces this one.</yellow>"
    success: "<prefix><green>Imported <count> warps. Backup: <backup></green>"
    failure: "<prefix><red>Import: <reason></red>"
    omitted: "<prefix><gray><count> more entries omitted from chat.</gray>"
    permission-notice: "<prefix><yellow>New imported warps require permission: <required>. EssentialsX permission grants, signs and costs are not imported.</yellow>"
    reasons:
      NEW: "Create"
      REPLACE: "Replace destination; preserve TPCore access settings"
      RENAME: "Create under a new name"
      SKIP: "Keep existing warp"
      INVALID_FILE: "Invalid YAML or fields"
      INVALID_NAME: "Invalid name (use 1-32 letters, digits, _ or -)"
      INVALID_WORLD: "World is not loaded or cannot be resolved"
      RESTRICTED: "Creation world is disallowed, or protection requires individual creation checks"
      INVALID_LOCATION: "Invalid coordinates or rotation"
      DUPLICATE: "Duplicate source name; skipped"
      BUSY: "Warp storage or another import is busy"
      NOT_READY: "Warp module or storage is unavailable"
      STALE: "Preview expired or source, destination, worlds or configuration changed; preview again"
      LIMIT: "Import exceeds configured file, byte or warp limits"
      SOURCE: "Source folder is missing or is outside the plugins directory"
      BACKUP_LIMIT: "Backup limit reached; archive old warp-import-backups directories before retrying"
      IO: "I/O failed; no successful import is reported. Check the server log and any backup"
      EMPTY: "Preview contains no importable warps"

# Search is case-insensitive and matches part of a warp name.
# When enabled, /warps opens inventory browsing for players; console keeps chat.
# /warps gui explicitly opens inventory browsing when this feature is enabled.
# Presentation keys are warp names. Rename their config keys when renaming a warp.
browsing:
  inventory-enabled: false
  inventory-rows: 6
  max-search-length: 32
  max-description-length: 512
  max-presentation-entries: 512
  default-icon: "BOOK"
  category-icon: "CHEST"
  previous-icon: "ARROW"
  next-icon: "ARROW"
  refresh-icon: "SUNFLOWER"
  close-icon: "BARRIER"
  # Example: hub: {icon: COMPASS, description: "Server arrival point"}
  presentations: {}
  messages:
    usage: "<prefix><yellow>/warps [category|page] [page]; /warps search <term> [page]; /warps category <category> [search <term>] [page]; /warps categories; /warps gui [search <term> | category <category>] [page]</yellow>"
    invalid-search: "<prefix><red>Search must contain 1–<limit> characters.</red>"
    search-header: "<prefix><gold>Warps matching '<search>' in <category> (page <page>/<maxpages>):</gold>"
    previous: "<yellow>[Previous]</yellow>"
    next: "<yellow>[Next]</yellow>"
    navigation: "<prefix><gray>Page <page>/<maxpages> — <total> results.</gray>"
    categories-header: "<prefix><gold>Warp categories:</gold>"
    category-item: "<yellow>[<category>]</yellow>"
    inventory-disabled: "<prefix><yellow>The inventory warp browser is disabled.</yellow>"
    inventory-title: "<gold>Warps: <category> (<page>/<maxpages>)</gold>"
    item-name: "<yellow><name></yellow> <red><availability></red>"
    item-lore:
      - "<gray><description></gray>"
      - "<gray>Category: <category></gray>"
      - "<gray>World: <world></gray>"
      - "<red><reason></red>"
      - "<gray>Click to request teleport; passwords use /warp <name> <password>.</gray>"
    category-title: "<gold>Warp categories (<page>/<maxpages>)</gold>"
    category-name: "<yellow><category></yellow>"
    category-lore:
      - "<gray>Click to browse this category.</gray>"
    refresh: "<green>[Refresh]</green>"
    close: "<red>[Close]</red>"
    all-categories: "All"
    categories-button: "<yellow>[Categories]</yellow>"
    search-button: "<yellow>[Search]</yellow>"
    command-description: "Browse server warps"

# Administrative controls; changing these settings reopens storage safely.
control:
  delete-confirmation-seconds: 30
  recovery-max-entries: 100
  recovery-retention-days: 7
  closure-reason-max-length: 256

# Plain closure reasons are rendered as text, never MiniMessage markup.
control-messages:
  closed: "<prefix><red>Warp <yellow><warp></yellow> is closed: <reason></red>"
  changed: "<prefix><yellow>Warp <warp> changed before teleportation. Please try again.</yellow>"
  delete-confirmation: "<prefix><yellow>Run /delwarp <warp> confirm within <seconds>s to archive and delete this warp.</yellow>"
  confirmation-expired: "<prefix><red>Deletion confirmation expired or the warp changed. Run /delwarp <warp> again.</red>"
  recovery-header: "<prefix><gold>Deleted warps (page <page>/<maxpages>):</gold>"
  recovery-entry: "<gray><warp> | deleted at <deleted-at> | /warprecover <id></gray>"
  recovery-empty: "<prefix><yellow>No recoverable deleted warps.</yellow>"
  recovery-not-found: "<prefix><red>Recovery entry was not found or has expired.</red>"
  recovery-success: "<prefix><green>Restored warp <warp> with its original metadata.</green>"
  recovery-conflict: "<prefix><red>Cannot restore: a warp with that name already exists.</red>"
  info-state: "<prefix><gray>Closed: <closed>; unlisted: <unlisted>; closure reason: <reason></gray>"
  default-closure-reason: "Temporarily unavailable."
  closed-label: "[Closed]"
  open-label: ""
  usage: "<prefix><yellow>/editwarp <name> close [reason] | open | unlisted | listed; /delwarp <name> [confirm]; /warprecover list [page] | <entry-id></yellow>"

# Staff edits preserve other metadata and never incur creation charges.
# Rename changes tpcore.warp.<name>; update external grants manually.
edit-messages:
  usage: "<prefix><yellow>Usage: /warpinfo <name> or /editwarp <name> rename <new-name> | relocate | category <category> | password set <password> | password clear | permission required | permission public</yellow>"
  success: "<prefix><green>Updated warp <yellow><warp></yellow>.</green>"
  rename-success: "<prefix><green>Renamed <yellow><old-name></yellow> to <yellow><warp></yellow>.</green> <yellow>Per-warp permission: <old-permission> → <permission>. Update external permission grants if required.</yellow>"
  rename-collision: "<prefix><red>Cannot rename: warp <yellow><warp></yellow> already exists.</red>"
  invalid-value: "<prefix><red>Invalid edit value. Categories use 1-32 letters, digits, underscores or hyphens; passwords must not be blank.</red>"
  info: "<prefix><gold>Warp <warp></gold><newline><gray>World: <world> (<world-id>)<newline>Position: <x>, <y>, <z>; yaw <yaw>, pitch <pitch><newline>Category: <category><newline>Password protected: <password-protected><newline>Permission required: <permission-required> (<permission>)<newline>Creator UUID: <creator><newline>Created at (epoch ms): <created-at></gray>"

# Module Messages (Alphabetically ordered keys)
messages:
  cooldown-active: "<prefix><red>You must wait <gold><seconds>s</gold> before using /warp again!</red>"
  cost-deducted: "<prefix><gold><cost></gold> <green>has been deducted from your account.</green>"
  cost-refunded: "<prefix><gold><cost></gold> <green>has been refunded to your account.</green>"
  del-warp-success: "<prefix><green>Warp <yellow><warp></yellow> has been deleted.</green>"
  del-warp-usage: "<prefix><red>Usage: <gold>/delwarp <name></gold></red>"
  insufficient-funds: "<prefix><red>You do not have enough money! Required: <gold><cost></gold>, Balance: <gold><balance></gold></red>"
  invalid-password: "<prefix><red>Incorrect password for warp <yellow><warp></yellow>!</red>"
  invalid-warp-name: "<prefix><red>Invalid warp name! Warp names must be 1-32 alphanumeric characters.</red>"
  limit-reached: "<prefix><red>You have reached the maximum warp limit!</red>"
  module-disabled: "<prefix><red>Warp module is currently disabled.</red>"
  no-permission: "<prefix><red>You do not have permission to access warp <yellow><warp></yellow>!</red>"
  only-players: "<prefix><red>Only players can execute this command!</red>"
  password-required: "<prefix><red>Warp <yellow><warp></yellow> is password protected! Usage: <gold>/warp <warp> <password></gold></red>"
  player-not-online: "<prefix><red>Player <yellow><target></yellow> is not currently online!</red>"
  prefix: "<gradient:#00D2FF:#3A7BD5><bold>TPCore</bold></gradient> <dark_gray>»</dark_gray> "
  set-warp-confirm: "<prefix><yellow>Warp <gold><warp></gold> already exists! Run <gold>/setwarp <warp> -f</gold> to overwrite it.</yellow>"
  set-warp-success: "<prefix><green>Warp <yellow><warp></yellow> set to your current location!</green>"
  set-warp-usage: "<prefix><red>Usage: <gold>/setwarp <name> [-f] [category] [password]</gold></red>"
  teleport-other-success: "<prefix><green>Teleported <gold><target></gold> to warp <yellow><warp></yellow>!</green>"
  teleport-success: "<prefix><green>Teleported to warp <yellow><warp></yellow>!</green>"
  teleported-by-other: "<prefix><green>You were teleported to warp <yellow><warp></yellow> by <gold><sender></gold>!</green>"
  unsafe-location: "<prefix><red>Teleport target location is unsafe or obstructed!</red>"
  warmup-already-active: "<prefix><red>You already have a warp teleport in progress!</red>"
  warmup-cancelled-damage: "<prefix><red>Teleport cancelled because you took damage!</red>"
  warmup-cancelled-move: "<prefix><red>Teleport cancelled because you moved!</red>"
  warmup-start: "<prefix><gray>Teleporting to warp <yellow><warp></yellow> in <gold><seconds></gold> seconds. <red>Do not move or take damage!</red></gray>"
  warp-list-category-header: "<prefix><gray>Available Warps in Category <gold><category></gold> (Page <gold><page></gold>/<gold><maxpages></gold>):</gray>"
  warp-list-empty: "<prefix><yellow>No warps found.</yellow>"
  warp-list-header: "<prefix><gray>Available Warps (Page <gold><page></gold>/<gold><maxpages></gold>):</gray>"
  warp-list-item: "  <dark_gray>•</dark_gray> <green><name></green> <red><availability></red> <gray>[<yellow><category></yellow>]</gray> <click:run_command:'/warp <name>'><hover:show_text:'<green>Click to teleport</green><br><gray>World: <yellow><world></yellow><br>Coords: <yellow><x>, <y>, <z></yellow>'><gold>[Teleport]</gold></hover></click>"
  warp-not-found: "<prefix><red>Warp <yellow><warp></yellow> was not found!</red>"
  warp-other-usage: "<prefix><red>Usage: <gold>/warpother <target> <name></gold></red>"
  warp-usage: "<prefix><red>Usage: <gold>/warp <name> [password]</gold></red>"
  world-not-loaded: "<prefix><red>Target world <yellow><world></yellow> is not currently loaded!</red>"

  operation-failed: "<prefix><red>Warp operation failed. Please contact an administrator.</red>"
  operation-busy: "<prefix><yellow>Warp service is busy. Please try again shortly.</yellow>"
  storage-not-ready: "<prefix><yellow>Warp storage is not ready. Please try again shortly.</yellow>"
  economy-unavailable: "<prefix><red>Paid warps require an available native asynchronous economy provider.</red>"
