  warp-other-usage: "<prefix><red>Usage: <gold>/warpother <target> <name></gold></red>"
  warp-usage: "<prefix><red>Usage: <gold>/warp <name> [password]</gold></red>"
  world-not-loaded: "<prefix><red>Target world <yellow><world></yellow> is not currently loaded!</red>"

  operation-failed: "<prefix><red>Warp operation failed. Please contact an administrator.</red>"
  operation-busy: "<prefix><yellow>Warp service is busy. Please try again shortly.</yellow>"
  storage-not-ready: "<prefix><yellow>Warp storage is not ready. Please try again shortly.</yellow>"
  economy-unavailable: "<prefix><red>Paid warp processing is unavailable. Please contact an administrator.</red>"

  # /warpstatus is a read-only health view. Payment evidence needs both
  # tpcore.warp.status and tpcore.warp.payments (or tpcore.warp.admin).
  # Payment pages reuse warps-per-page, capped internally at 100 entries.
  # Existing insufficient-funds templates support <cost> and <balance>.
  # Balance is shown as diagnostics.unknown because it is not queried.
  diagnostics:
    "yes": "yes"
    "no": "no"
    unknown: "unavailable"
    status:
      - "<prefix><gold>Warp status</gold> <gray>(live observations)</gray>"
      - "<gray>Storage: <white><storage></white> | Ready: <white><ready></white> | Module enabled: <white><enabled></white></gray>"
      - "<gray>Warps: <white><warps></white> | Configured limit (0 = unlimited): <white><warp-limit></white> | Cache capacity: <white><cache-capacity></white></gray>"
      - "<gray>Operations: <white><pending>/<operation-capacity></white> | Teleports: <white><teleports></white> | Mutations: <white><mutations></white> | Migration: <white><migrating></white></gray>"
      - "<gray>Economy usable: <white><economy></white> | Journal ready: <white><journal-ready></white> | Reconciliation required: <white><reconciliation></white></gray>"
      - "<gray>Payment operations: <white><payment-operations></white> | Retained intents: <white><intents>/<intent-capacity></white> (may include active payments)</gray>"
      - "<gray>Authorized staff: /warpstatus payments [page] shows evidence only. No transfers are retried.</gray>"
    payment-header:
      - "<prefix><gold>Payment evidence</gold> <gray>Page <page>/<pages> | <total> retained intents</gray>"
      - "<yellow>warps/refunds.properties records player UUID | amount. These records do not prove a debit or refund completed. Compare provider debit/credit history before changing anything; never retry an ambiguous refund blindly.</yellow>"
    payment-entry: "<gray>Ticket <white><ticket></white> | Record: <white><record></white></gray>"
    no-payments: "<prefix><gray>No retained payment intents.</gray>"
    failure: "<prefix><red>Payment evidence is unavailable. Check the server log and preserve warps/refunds.properties.</red>"
