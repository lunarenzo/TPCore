# TPCore — TPA Module Configuration
# Author: lunarenzo (lunatech)

enabled: true

# Time in seconds before an unaccepted TPA request automatically expires
request-timeout-seconds: 30

# Cooldown in seconds between outgoing TPA requests per player
request-cooldown-seconds: 10

# Maximum number of pending incoming TPA requests allowed per target player (DOS/spam guard)
max-pending-requests-per-player: 5

# Warmup delay in seconds before teleporting after request acceptance
warmup-seconds: 3

# Whether movement > 0.5 blocks cancels the teleport warmup
cancel-on-move: true

# Whether taking damage cancels the teleport warmup
cancel-on-damage: true

# Whether players can send TPA requests to themselves
allow-self-tpa: false

# Whether to require destination ground safety before teleportation
require-safe-location: true

# Teleport protection duration in seconds granted to player after teleporting (0 to disable)
protection-seconds: 4

# Whether to immediately cancel teleport protection if the protected player attacks another entity
protection-cancel-on-attack: true

# Whether protection protects against all damage types (true) or PVP damage only (false)
protection-all-damage: false

# Whether to enable confirmation menus (GUI or DIALOG) for TPA requests
# When set to false, TPA operates in classic instant chat mode
enable-confirmation-menu: true

# Granular Confirmation Toggles (Used when enable-confirmation-menu is true)
# Enable confirmation menu when executing /tpa
enable-tpa-confirm: true

# Enable confirmation menu when executing /tpahere
enable-tpahere-confirm: true

# Enable confirmation menu when executing /tpaccept
enable-tpaccept-confirm: true

# Confirmation interface mode when enabled: GUI or DIALOG (Default: GUI)
# GUI = 3-row Chest Inventory menu with customizable player head and buttons
# DIALOG = Native Paper Dialog API menu (Paper 1.21.6+ required, falls back to GUI on older versions)
confirmation-mode: GUI

# 3-Row Chest GUI Settings (Used when confirmation-mode is GUI)
gui-title: "<gradient:#00D2FF:#3A7BD5><bold>Teleport Request</bold></gradient>"
gui-accept-slot: 15
gui-deny-slot: 11
gui-head-slot: 13
gui-accept-item: "LIME_STAINED_GLASS_PANE"
gui-accept-name: "<green><bold>ACCEPT REQUEST</bold></green>"
gui-deny-item: "RED_STAINED_GLASS_PANE"
gui-deny-name: "<red><bold>DENY REQUEST</bold></red>"
gui-send-confirm-name: "<green><bold>CONFIRM & SEND</bold></green>"
gui-send-cancel-name: "<red><bold>CANCEL</bold></red>"
gui-send-tpa-lore: "<gray>Send a teleport request to </gray><yellow><target></yellow>?\n<gray>You will be teleported to their location once accepted.</gray>"
gui-send-tpahere-lore: "<gray>Request </gray><yellow><target></yellow><gray> to teleport to you?</gray>\n<gray>They will be teleported to your location once accepted.</gray>"
gui-accept-tpa-lore: "<yellow><sender></yellow><gray> wants to teleport to your location.</gray>\n<gray>Do you accept?</gray>"
gui-accept-tpahere-lore: "<yellow><sender></yellow><gray> requests you to teleport to their location.</gray>\n<gray>Do you accept?</gray>"
gui-fill-item: "GRAY_STAINED_GLASS_PANE"
gui-fill-empty-slots: true

# Paper Dialog API Settings (Used when confirmation-mode is DIALOG on Paper 1.21.6+)
dialog-title: "<gradient:#00D2FF:#3A7BD5><bold>Teleport Confirmation</bold></gradient>"
dialog-body-text: "<yellow><sender></yellow> sent a teleport request.\nDo you accept?"
dialog-send-tpa-body-text: "<gray>Send a teleport request to </gray><yellow><target></yellow>?\n<gray>You will be teleported to their location once accepted.</gray>"
dialog-send-tpahere-body-text: "<gray>Request </gray><yellow><target></yellow><gray> to teleport to you?</gray>\n<gray>They will be teleported to your location once accepted.</gray>"
dialog-accept-tpa-body-text: "<yellow><sender></yellow><gray> wants to teleport to your location.</gray>\n<gray>Do you accept?</gray>"
dialog-accept-tpahere-body-text: "<yellow><sender></yellow><gray> requests you to teleport to their location.</gray>\n<gray>Do you accept?</gray>"
dialog-send-confirm-text: "<green><bold>CONFIRM & SEND</bold></green>"
dialog-send-cancel-text: "<red><bold>CANCEL</bold></red>"
dialog-accept-text: "<green><bold>ACCEPT</bold></green>"
dialog-deny-text: "<red><bold>DENY</bold></red>"

# Audio-Visual Countdown & Feedback Settings (Warmup)
enable-action-bar: true
action-bar-format: "<gold>Teleporting in <yellow><seconds>s</yellow>... Do not move!</gold>"

enable-title: true
title-format: "<gold><bold>TELEPORTING</bold></gold>"
subtitle-format: "<gray>in <yellow><seconds>s</yellow>... Stay still!</gray>"
cancel-title-format: "<red><bold>TPA CANCELLED</bold></red>"

enable-bossbar: true
bossbar-format: "<gold>Teleporting in <yellow><seconds>s</yellow>...</gold>"
bossbar-color: "YELLOW"
bossbar-overlay: "PROGRESS"

enable-sounds: true
tick-sound: "block.note_block.pling"
tick-sound-volume: 0.8
tick-sound-pitch-step: 0.15
completion-sound: "entity.player.teleport"
completion-sound-volume: 1.0
completion-sound-pitch: 1.0
cancel-sound: "entity.villager.no"
cancel-sound-volume: 0.8
cancel-sound-pitch: 1.0

# Economy Submodule Settings for TPA (Requires Vault / VaultUnlocked)
economy:
  enabled: false
  tpa-cost: 10.0
  tpahere-cost: 15.0
  charge-on-send: true
  target-reward-percent: 0.0
  refund-on-deny: true
  refund-on-expire: true
  refund-on-cancel-by-sender: true
  refund-on-warmup-cancel: false
  refund-on-unsafe-destination: true

