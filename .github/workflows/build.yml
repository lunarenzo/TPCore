name: TPCore CI / CD Build Workflow

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package TPCore JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Determine Plugin Version & Build Name
        id: versioning
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            IS_RELEASE="true"
          else
            VERSION="1.0.0-dev-${SHORT_SHA}"
            IS_RELEASE="false"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT
          echo "Building TPCore Version: ${VERSION}"

      - name: Build Shadow Plugin JAR
        run: ./gradlew shadowJar -PpluginVersion="${{ steps.versioning.outputs.version }}" --no-daemon

      - name: Upload Downloadable Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TPCore-${{ steps.versioning.outputs.version }}
          path: build/libs/*.jar
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TPCore v${{ steps.versioning.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
